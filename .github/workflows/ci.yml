name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          # Throwaway container reachable only from this job: no password stored in the repo.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: taskline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Alembic migrates this DB; pytest runs against a separate Postgres DB (created below) so
      # its create_all/drop_all never collides with the migrated schema.
      DATABASE_URL: postgresql://postgres@localhost:5432/taskline_test
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/taskline_pytest
      # SECRET_KEY is generated per run (see "Generate ephemeral secrets"); never stored in the repo.
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      GOOGLE_CLIENT_ID: ""
      GOOGLE_CLIENT_SECRET: ""
      GOOGLE_REDIRECT_URI: http://localhost:8000/api/v1/auth/google/callback
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
      LOG_LEVEL: INFO
      RATE_LIMIT_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Generate ephemeral secrets
        run: |
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          echo "SECRET_KEY=$secret" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Audit Python dependencies
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy app

      - name: Create pytest database
        env:
        run: psql -h localhost -U postgres -d postgres -c "CREATE DATABASE taskline_pytest;"

      - name: Migrations
        run: alembic upgrade head

      - name: Tests
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit npm dependencies (runtime)
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Tests (with coverage)
        run: npm run test:coverage

      - name: Build
        run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Create .env from example (with valid secrets)
        run: |
          cp .env.example .env
          # Replace the placeholders: the backend rejects short/placeholder SECRET_KEYs and
          # docker-compose.yml requires POSTGRES_PASSWORD.
          SECRET_KEY="$(openssl rand -hex 32)"
          POSTGRES_PASSWORD="$(openssl rand -hex 16)"
          sed -i "s|^SECRET_KEY=.*|SECRET_KEY=${SECRET_KEY}|" .env
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=${POSTGRES_PASSWORD}|" .env
          sed -i "s|^DATABASE_URL=.*|DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@localhost:5432/taskline|" .env

      - name: Validate compose files
        run: |
          docker compose config -q
          docker compose -f docker-compose.dev.yml config -q

      - name: Build images
        run: docker compose build
