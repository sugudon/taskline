# Production stack for a single VPS: Caddy (HTTPS) -> frontend (nginx) + backend (FastAPI) -> Postgres.
# The app and API share one origin: https://$DOMAIN serves the SPA, https://$DOMAIN/api/* the API.
# Usage on the server:  docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build

name: taskline

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env.production}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env.production}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-taskline}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-taskline}
      FRONTEND_URL: https://${DOMAIN}
      CORS_ORIGINS: https://${DOMAIN}
      GOOGLE_REDIRECT_URI: https://${DOMAIN}/api/v1/auth/google/callback
    # Behind Caddy: trust X-Forwarded-* so rate limiting sees the real client IP.
    # Only Caddy can reach this port (no published ports).
    command: ["--proxy-headers", "--forwarded-allow-ips", "*"]
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Empty = same origin; the SPA calls /api/v1 on its own domain.
        VITE_API_URL: ""
    restart: unless-stopped
    environment:
      API_ORIGIN: https://${DOMAIN}
    depends_on:
      - backend

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
