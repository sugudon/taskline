# Production stack: frontend (nginx) + backend (FastAPI) + Postgres on one origin.
# https://$DOMAIN serves the SPA, https://$DOMAIN/api/* the API.
#
# HTTPS is terminated by a reverse proxy:
#   - default: an existing Traefik on the host (docker provider, `websecure` entrypoint,
#     `letsencrypt` cert resolver) picks up the labels below — no ports are published.
#   - no Traefik on the server: enable the bundled Caddy with COMPOSE_PROFILES=caddy
#     (binds :80/:443, needs ACME_EMAIL).
# Usage on the server:  docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build

name: taskline

services:
  caddy:
    image: caddy:2.8-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env.production}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-taskline}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-taskline}
      FRONTEND_URL: https://${DOMAIN}
      CORS_ORIGINS: https://${DOMAIN}
      GOOGLE_REDIRECT_URI: https://${DOMAIN}/api/v1/auth/google/callback
    # Behind Caddy: trust X-Forwarded-* so rate limiting sees the real client IP.
    # Only Caddy can reach this port (no published ports).
    command: ["--proxy-headers", "--forwarded-allow-ips", "*"]
    depends_on:
      db:
        condition: service_healthy
    labels:
      traefik.enable: "true"
      traefik.http.routers.taskline-api.rule: Host(`${DOMAIN}`) && (PathPrefix(`/api/`) || Path(`/health`) || PathPrefix(`/docs`) || Path(`/openapi.json`))
      traefik.http.routers.taskline-api.priority: "100"
      traefik.http.routers.taskline-api.entrypoints: websecure
      traefik.http.routers.taskline-api.tls.certresolver: letsencrypt
      traefik.http.routers.taskline-api.middlewares: taskline-hsts,taskline-compress
      traefik.http.routers.taskline-api.service: taskline-api
      traefik.http.services.taskline-api.loadbalancer.server.port: "8000"

  frontend:
    build:
      context: ./frontend
      args:
        # Empty = same origin; the SPA calls /api/v1 on its own domain.
        VITE_API_URL: ""
    restart: unless-stopped
    environment:
      API_ORIGIN: https://${DOMAIN}
    depends_on:
      - backend
    labels:
      traefik.enable: "true"
      traefik.http.routers.taskline-web.rule: Host(`${DOMAIN}`)
      traefik.http.routers.taskline-web.priority: "10"
      traefik.http.routers.taskline-web.entrypoints: websecure
      traefik.http.routers.taskline-web.tls.certresolver: letsencrypt
      traefik.http.routers.taskline-web.middlewares: taskline-hsts,taskline-compress
      traefik.http.routers.taskline-web.service: taskline-web
      traefik.http.services.taskline-web.loadbalancer.server.port: "3000"
      traefik.http.middlewares.taskline-hsts.headers.stsSeconds: "31536000"
      traefik.http.middlewares.taskline-hsts.headers.stsIncludeSubdomains: "true"
      traefik.http.middlewares.taskline-compress.compress: "true"

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
