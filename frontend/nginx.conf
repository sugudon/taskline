# Rendered from /etc/nginx/templates/default.conf.template by the nginx image entrypoint (envsubst,
# restricted to API_ORIGIN via NGINX_ENVSUBST_FILTER so nginx variables like $uri are left alone).
server {
    listen 3000;
    listen [::]:3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    include /etc/nginx/conf.d/snippets/security-headers.conf;

    # Fingerprinted build assets: cache aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/conf.d/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Other static files
    location ~* \.(?:ico|png|jpe?g|gif|svg|webp|woff2?|ttf|eot|css|js|map)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        include /etc/nginx/conf.d/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # index.html must never be cached so new deploys are picked up
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/conf.d/snippets/security-headers.conf;
    }

    # SPA fallback (inherits the server-level headers; it has no add_header of its own)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
